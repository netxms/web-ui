name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against package.json version
        run: |
          version=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Enable Yarn
        run: npm install -g corepack@0.36.0 && corepack enable
      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-node-26-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-node-26-yarn-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint:ci
      - name: Build
        run: yarn build
      - name: Package release
        run: |
          version=$(jq -r .version package.json)
          bundle="netxms-console-$version"
          mkdir -p "$RUNNER_TEMP/release/$bundle"
          cp -a dist/. "$RUNNER_TEMP/release/$bundle/"
          tar -czf "$RUNNER_TEMP/release/$bundle.tar.gz" -C "$RUNNER_TEMP/release" "$bundle"
          cd "$RUNNER_TEMP/release"
          sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256"
      - name: Publish release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bundle="netxms-console-${GITHUB_REF_NAME#v}"
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "${args[@]}" "$bundle.tar.gz" "$bundle.tar.gz.sha256"
