# Site config for an nginx host, with TLS. Goes in /etc/nginx/conf.d/; change every EDIT.

include snippets/web-ui-http.conf;

upstream netxms_webapi {
    # EDIT: [WEBAPI] Address/Port in netxmsd.conf; 127.0.0.1:8000 by default.
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;  # EDIT
    return 301 https://$host$request_uri;
}

server {
    # From nginx 1.25.1 this warns: drop `http2` here and add `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.example.com;  # EDIT

    ssl_certificate /etc/ssl/certs/console.example.com.pem;  # EDIT
    ssl_certificate_key /etc/ssl/private/console.example.com.key;  # EDIT

    root /var/www/web-ui;  # EDIT: where dist/ was copied

    include snippets/web-ui-app.conf;
}
