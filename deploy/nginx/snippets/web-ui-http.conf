# Context: http. Names are prefixed so they cannot collide with another site's map or zone.

# WebSocket upgrade for object tool output and SSH terminals.
map $http_upgrade $netxms_console_connection {
    default upgrade;
    ''      close;
}

# Content-hashed bundle files are immutable; index.html and the other routes must revalidate,
# or a new build is picked up only after the old bundle files are gone.
map $uri $netxms_console_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    default     "no-cache";
}

# Sign-in attempts per client address. The server's intruder lockout is per account; this slows
# guessing across accounts. Bursts of 20 cover 2FA sign-ins, which take 2-3 calls.
limit_req_zone $binary_remote_addr zone=netxms_console_login:10m rate=10r/m;
