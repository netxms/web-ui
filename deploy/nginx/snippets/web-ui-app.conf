# Context: server. Needs web-ui-http.conf at http level and an upstream named
# netxms_webapi.

server_tokens off;

# netxmsd never compresses, and the object tree is ~1 MB of JSON.
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css image/svg+xml;

# Image library uploads.
client_max_body_size 32m;

# nginx drops all of these in a location that sets an add_header of its own, so no location
# below does.
add_header Cache-Control $netxms_console_cache_control;
# A map tile server other than tile.netxms.org (Client.TileServerURL) goes into img-src; a
# WebAPI on another origin, with its wss:// form, into connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.netxms.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' data:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Once the console is HTTPS-only for good. Never on plain HTTP, such as the Docker image.
# add_header Strict-Transport-Security "max-age=31536000" always;

# The console calls /api/v1/...; netxmsd serves /v1/...
location /api/ {
    proxy_pass http://netxms_webapi/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $netxms_console_connection;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Log queries, script runs, idle tool output WebSockets. SSH terminals send a keepalive frame
    # well inside this, and traffic in either direction restarts these timers.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /api/v1/login {
        limit_req zone=netxms_console_login burst=20 nodelay;
        # The console reads the default 503 as an outage and starts reconnecting.
        limit_req_status 429;
        proxy_pass http://netxms_webapi/v1/login;
    }
}

# A missing bundle file is a 404, never index.html run as a script.
location /assets/ {
    try_files $uri =404;
}

# History-mode router: every other path is a client-side route.
location / {
    try_files $uri $uri/ /index.html;
}
